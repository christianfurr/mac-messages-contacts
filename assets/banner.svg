<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1017"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b9bff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4cd964"/>
      <stop offset="1" stop-color="#30b350"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" stroke="#2a3242" stroke-width="1"/>

  <!-- chat bubbles -->
  <g>
    <rect x="70" y="62" width="240" height="52" rx="26" fill="url(#green)"/>
    <text x="190" y="95" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="21" fill="#ffffff">who texted me today?</text>
    <path d="M78 108 L64 120 L86 113 Z" fill="#30b350"/>

    <rect x="120" y="132" width="290" height="52" rx="26" fill="url(#blue)"/>
    <text x="265" y="165" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19" fill="#ffffff">SELECT * FROM chat.db</text>
    <path d="M402 178 L416 190 L394 183 Z" fill="#0a84ff"/>

    <rect x="70" y="202" width="330" height="52" rx="26" fill="#2b3143"/>
    <text x="235" y="235" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="21" fill="#c8d0e0">3 threads, names resolved ✓</text>
  </g>

  <!-- divider -->
  <line x1="490" y1="70" x2="490" y2="250" stroke="#2a3242" stroke-width="1.5"/>

  <!-- title -->
  <text x="540" y="140" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#f2f5fa">mac-messages-contacts</text>
  <text x="540" y="185" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="24" fill="#8a94a8">A Claude Code skill for your Messages &amp; Contacts</text>
  <text x="540" y="225" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#5a90c8">sqlite3 · read-only · zero dependencies · no MCP server</text>
</svg>
